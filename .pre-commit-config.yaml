ci:
  autofix_commit_msg: "chore(ci): pre-commit auto fixes"
  autoupdate_commit_msg: "chore(ci): pre-commit autoupdate"
  autoupdate_schedule: quarterly
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 'v6.0.0'
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-builtin-literals
      - id: check-executables-have-shebangs
      - id: check-json
      - id: check-yaml
      - id: debug-statements
      - id: requirements-txt-fixer
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: 'v2.4.0'
    hooks:
      - id: mypy
        additional_dependencies: [types-PyYAML]
        args: ["--config-file=pyproject.toml", "src/", "docs/"]
        pass_filenames: false
  - repo: https://github.com/asottile/pyupgrade
    rev: 'v3.21.2'
    hooks:
      - id: pyupgrade
        args:
          - --py39-plus
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.2
    hooks:
      - id: check-metaschema
        files: ^src/rapids_dependency_file_generator/schema.json$
      - id: check-jsonschema
        files: ^tests/examples/([^/]*)/dependencies.yaml$
        args: ["--schemafile", "src/rapids_dependency_file_generator/schema.json"]
      - id: check-github-workflows
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff
        files: src/.*$
      - id: ruff-format
        files: src/.*$
  - repo: https://github.com/rstcheck/rstcheck
    rev: v6.3.0
    hooks:
      - id: rstcheck
        args: ["--config", "pyproject.toml"]
        additional_dependencies:
          - 'rstcheck[sphinx,toml]'
        exclude:
          (?x)
            ^docs/source/_templates/.*$
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck
  - repo: https://github.com/rapidsai/pre-commit-hooks
    rev: v1.7.0
    hooks:
      - id: verify-pyproject-license
        exclude:
          (?x)
            ^tests/.*$
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        additional_dependencies: [pyyaml]
        exclude: |
          (?x)^(
            .*/output/expected/.*$
          )
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.1
    hooks:
      - id: zizmor
default_language_version:
  python: python3
